name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: this workflow builds and tests, and never writes back.
permissions:
  contents: read

# A newer push to the same branch supersedes an in-progress run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Includes validating generated payloads against the provided Tive schema.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
